[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "gmat-czml"
version = "0.3.0"
description = "Convert GMAT (and any canonical-schema) trajectories to CZML for browser-based 3D Cesium visualization."
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Dimitrije Jankovic" }]
keywords = ["astrodynamics", "orbital-mechanics", "cesium", "czml", "visualization", "gmat", "space"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: POSIX :: Linux",
  "Operating System :: Microsoft :: Windows",
  "Operating System :: MacOS",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3 :: Only",
  "Topic :: Scientific/Engineering :: Astronomy",
  "Topic :: Scientific/Engineering :: Visualization",
  "Typing :: Typed",
]
dependencies = [
  "czml3>=3.3,<4",
  # orbit-formats owns the canonical state-series schema gmat-czml consumes and provides the
  # frame rotation + ECEF/geodetic projection the ground track delegates to. Floored at >=0.5 —
  # the line where that geodetic helper lands. See docs/design/decisions.md (D6).
  "orbit-formats>=0.5",
  "pandas>=2.0",
  "numpy>=1.24",
]

[project.optional-dependencies]
# The optional [server] extra: a FastAPI app that hosts a CZML document behind an embedded CesiumJS
# viewer (CzmlDocument.serve / `gmat-czml serve`). Deliberately out of the base dependencies so a
# plain `pip install gmat-czml` stays light — the minimal-install smoke test asserts neither fastapi
# nor uvicorn is pulled in. server.py is a leaf module imported only when the server is used, so the
# import never runs in a base install.
server = [
  "fastapi>=0.110",
  "uvicorn>=0.29",
]
# The optional [ion] extra: a Cesium ion upload helper (CzmlDocument.upload_to_ion / `gmat-czml
# upload`). boto3 signs the S3 put ion's REST upload hands back; the three REST calls use the
# standard library, so boto3 is the only added dependency. Kept out of the base dependencies so a
# plain `pip install gmat-czml` stays light — the minimal-install smoke test asserts boto3 is not
# pulled in; `pip install gmat-czml[ion]` adds it.
ion = [
  "boto3>=1.26",
]

[project.scripts]
gmat-czml = "gmat_czml.cli:main"

[project.urls]
Homepage = "https://github.com/astro-tools/gmat-czml"
Repository = "https://github.com/astro-tools/gmat-czml"
Issues = "https://github.com/astro-tools/gmat-czml/issues"
Documentation = "https://astro-tools.github.io/gmat-czml/"
Changelog = "https://github.com/astro-tools/gmat-czml/blob/main/CHANGELOG.md"

[dependency-groups]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.6",
  "mypy>=1.11",
  "pandas-stubs",
  # gmat-run is the source object the optional gmat-run adapter converts. It is a dev-only
  # dependency — never a runtime one (the adapter imports it lazily) — so it is exercised here and
  # by the typechecker but stays absent from the minimal install. Its only runtime dep is pandas
  # (gmatpy is discovered at call time, so no GMAT engine is pulled in).
  "gmat-run>=0.6",
  # The headless-browser harness for the CesiumJS-parse check (the `browser`-marked tests).
  "pytest-playwright>=0.5",
  # The validation harness. jsonschema + referencing validate every emitted document against
  # the official CZML JSON schema vendored under tests/data/czml-schema/ (the `czml`-marked
  # tests). skyfield is the non-GMAT producer fixture — a TLE propagation exercised end-to-end
  # through to_czml; its byte golden is regenerated deliberately when the skyfield pin changes.
  "jsonschema>=4.20",
  "types-jsonschema",
  "referencing>=0.30",
  "skyfield>=1.49",
  # The [server] extra's deps, exercised here so the server tests run in the regular test matrix
  # (and the cesium-parse job) without `--all-extras`. httpx backs fastapi's TestClient, which the
  # unit-level server tests drive without binding a socket; the browser test runs a live uvicorn.
  "fastapi>=0.110",
  "uvicorn>=0.29",
  "httpx>=0.27",
  # The [ion] extra's dep, exercised here so the ion upload tests run in the regular test matrix.
  # boto3 is mocked at the network boundary in those tests — no AWS calls and no credentials.
  "boto3>=1.26",
]
docs = [
  "mkdocs-material>=9.5",
  "mkdocstrings[python]>=0.26",
]

[tool.hatch.build.targets.wheel]
packages = ["src/gmat_czml"]

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
  "E", "W",   # pycodestyle
  "F",        # pyflakes
  "I",        # isort
  "B",        # flake8-bugbear
  "UP",       # pyupgrade
  "SIM",      # flake8-simplify
  "RUF",      # ruff-specific
]

[tool.mypy]
python_version = "3.10"
strict = true
files = ["src/gmat_czml", "tests"]

# skyfield (the non-GMAT producer fixture) ships no type information.
[[tool.mypy.overrides]]
module = ["skyfield.*"]
ignore_missing_imports = true

# boto3 (the optional [ion] extra) ships no type stubs; the upload helper treats its S3 client as
# untyped (the client is bound to Any at the one call site, so no Any escapes into a typed return).
[[tool.mypy.overrides]]
module = ["boto3", "boto3.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = "-ra --strict-markers --strict-config"
markers = [
  "czml: emits CZML and validates it (the CZML-schema-validation job).",
  "browser: headless-browser CesiumJS-parse checks (the cesium-parse job); needs chromium.",
]

[tool.coverage.run]
source = ["src/gmat_czml"]
branch = true

[tool.coverage.report]
show_missing = true
exclude_also = [
  "if TYPE_CHECKING:",
  "raise NotImplementedError",
  "@overload",
  "^\\s*\\.\\.\\.$",
]
