name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }}, py${{ matrix.python-version }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      # 3 OSes × 3 Python minors. gmat-czml is pure Python, so the matrix is the
      # platform / interpreter spread. The browser and czml-validation jobs run once
      # on Ubuntu (their output is platform-independent), so they are excluded here.
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
        python-version: ['3.10', '3.11', '3.12']
    steps:
      - uses: actions/checkout@v4
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install uv
        uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - name: Install project
        run: uv sync --all-groups
      - name: Run pytest
        run: uv run pytest -m "not browser and not czml" --cov --cov-report=term-missing

  lint:
    name: lint
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run ruff check
      - run: uv run ruff format --check

  typecheck:
    name: typecheck
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run mypy

  # Smoke-check that `pip install gmat-czml` (no dev group) imports cleanly and stays light, and
  # that the optional [server] / [ion] extras add — but only add — their own deps. Catches a
  # dev-only dependency leaking into the default install path, and pins the extras' DoD: a base
  # install pulls neither fastapi/uvicorn nor boto3; `pip install .[server]` pulls the server deps
  # and `pip install .[ion]` pulls boto3.
  minimal-install:
    name: minimal install smoke
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install .
      - run: python -c "import gmat_czml; print(gmat_czml.__version__)"
      # The base install is light: no optional-extra deps (fastapi, uvicorn, boto3) are present.
      - name: base install pulls no optional-extra deps
        run: |
          python - <<'PY'
          import importlib.util, sys
          leaked = [m for m in ("fastapi", "uvicorn", "boto3") if importlib.util.find_spec(m) is not None]
          if leaked:
              sys.exit(f"base install unexpectedly pulled: {', '.join(leaked)}")
          print("base install is extra-free")
          PY
      # The [server] extra adds both server deps, so `.serve()` is reachable.
      - run: pip install '.[server]'
      - run: python -c "import fastapi, uvicorn; import gmat_czml.server; print('server extra ok')"
      # The [ion] extra adds boto3, so `.upload_to_ion()` is reachable.
      - run: pip install '.[ion]'
      - run: python -c "import boto3; import gmat_czml.ion; print('ion extra ok')"

  # Validate the emitted CZML against the official CZML JSON schema (vendored under
  # tests/data/czml-schema/) and byte-diff it against the committed golden corpus, on the real
  # GMAT and TLE producer fixtures.
  czml-validate:
    name: CZML validation
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run pytest -m czml -v

  # Load the emitted CZML in a real headless CesiumJS client (Playwright + chromium) to catch
  # valid-but-unrenderable output the schema check alone misses, and assert a correct, animated
  # orbit path on the real GMAT and TLE producer fixtures.
  cesium-parse:
    name: headless CesiumJS parse
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: astral-sh/setup-uv@v4
        with:
          enable-cache: true
          cache-dependency-glob: uv.lock
      - run: uv sync --all-groups
      - run: uv run playwright install --with-deps chromium
      - run: uv run pytest -m browser -v

  # Validate CITATION.cff against the Citation File Format v1.2.0 schema.
  citation:
    name: citation file (cffconvert)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install cffconvert==2.0.0
      - run: cffconvert --validate -i CITATION.cff
