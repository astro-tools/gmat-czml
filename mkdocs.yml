site_name: gmat-czml
site_description: Convert GMAT (and any canonical-schema) trajectories to CZML for browser-based 3D Cesium visualization.
site_url: https://astro-tools.github.io/gmat-czml/
repo_url: https://github.com/astro-tools/gmat-czml
repo_name: astro-tools/gmat-czml
edit_uri: edit/main/docs/

theme:
  name: material
  features:
    - content.code.copy
    - navigation.indexes
    - navigation.instant
    - navigation.sections
    - navigation.top
    - search.highlight
    - search.suggest
    - toc.follow
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-7
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: teal
      accent: teal
      toggle:
        icon: material/brightness-4
        name: Switch to light mode

nav:
  - Home: index.md
  - Getting started: getting-started.md
  - Guide:
      - Canonical input schema: schema.md
      - Orbit path: conversion/orbit-path.md
      - Ground track: conversion/ground-track.md
      - Maneuvers: conversion/maneuvers.md
      - Attitude: conversion/attitude.md
      - Contacts: conversion/contacts.md
      - Styling: styling.md
      - Command line: cli.md
      - Server mode: server.md
      - Cesium ion upload: ion.md
      - gmat-run adapter: conversion/gmat-run-adapter.md
  - Gallery: gallery.md
  - API reference: api.md
  - Design:
      - Decisions: design/decisions.md

plugins:
  - search
  - mkdocstrings:
      default_handler: python
      handlers:
        python:
          paths: [src]
          options:
            # Render the source docstrings' reST cross-reference roles as clean inline code.
            extensions:
              - scripts/griffe_sphinx_roles.py
            show_source: false
            show_root_heading: true
            show_root_full_path: false
            show_symbol_type_heading: true
            show_symbol_type_toc: true
            members_order: source
            separate_signature: true
            show_signature_annotations: true
            signature_crossrefs: true
            docstring_style: google
            merge_init_into_class: true
            filters: ["!^_"]

markdown_extensions:
  - admonition
  - attr_list
  - md_in_html
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - tables
  - toc:
      permalink: true

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/astro-tools/gmat-czml
